version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: reseller_panel_db
    environment:
      MYSQL_DATABASE: reseller_panel
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - reseller_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reseller_panel_redis
    ports:
      - "6379:6379"
    networks:
      - reseller_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: reseller_panel_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    networks:
      - reseller_network
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: reseller_panel_celery
    command: celery -A app.celery_worker worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    env_file:
      - ./backend/.env
    networks:
      - reseller_network
    restart: unless-stopped

  celery_beat:
    build: ./backend
    container_name: reseller_panel_celery_beat
    command: celery -A app.celery_worker beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    env_file:
      - ./backend/.env
    networks:
      - reseller_network
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: reseller_panel_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - reseller_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  reseller_network:
    driver: bridge
