version: '3.8'

services:
  db:
    image: postgres:15
    container_name: reseller_panel_db
    environment:
      POSTGRES_DB: reseller_panel
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - reseller_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: reseller_panel_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    networks:
      - reseller_network
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: reseller_panel_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - reseller_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  reseller_network:
    driver: bridge
