<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کریدیت</title>

    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <h5>پنل مدیریت</h5>
            </div>

            <div class="user-info">
                <p><strong id="userFullName">مدیر سیستم</strong></p>
                <p id="userUsername">admin</p>
            </div>

            <nav class="nav-menu">
                <a href="/pages/admin/dashboard.html" class="nav-item">
                    <i class="material-icons">dashboard</i>
                    داشبورد
                </a>
                <a href="/pages/admin/products.html" class="nav-item">
                    <i class="material-icons">inventory</i>
                    مدیریت محصولات
                </a>
                <a href="/pages/admin/resellers.html" class="nav-item">
                    <i class="material-icons">people</i>
                    مدیریت نمایندگان
                </a>
                <a href="/pages/admin/credit.html" class="nav-item active">
                    <i class="material-icons">attach_money</i>
                    مدیریت کریدیت
                </a>
                <a href="#" class="nav-item" onclick="logout()">
                    <i class="material-icons">exit_to_app</i>
                    خروج
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Topbar -->
            <div class="topbar">
                <div>
                    <span class="menu-toggle" onclick="toggleSidebar()">
                        <i class="material-icons">menu</i>
                    </span>
                    <h5 style="display: inline-block; margin-right: 10px;">مدیریت کریدیت</h5>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Quick Add Credit -->
                <div class="row">
                    <div class="col s12">
                        <div class="card custom-card">
                            <div class="card-content">
                                <span class="card-title">
                                    <i class="material-icons left">add_circle</i>
                                    افزودن سریع کریدیت
                                </span>
                                <form id="quickAddCreditForm">
                                    <div class="row" style="margin-top: 20px;">
                                        <div class="input-field col s12 m4">
                                            <select id="quickResellerId" required>
                                                <option value="" disabled selected>انتخاب نماینده</option>
                                            </select>
                                            <label>نماینده *</label>
                                        </div>
                                        <div class="input-field col s12 m3">
                                            <input id="quickAmount" type="number" min="1" required>
                                            <label for="quickAmount">مقدار کریدیت *</label>
                                        </div>
                                        <div class="input-field col s12 m3">
                                            <input id="quickNote" type="text">
                                            <label for="quickNote">یادداشت (اختیاری)</label>
                                        </div>
                                        <div class="col s12 m2">
                                            <button type="submit" class="btn waves-effect waves-light green" style="width: 100%; margin-top: 20px;">
                                                <i class="material-icons left">check</i>
                                                افزودن
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resellers Credit Overview -->
                <div class="row">
                    <div class="col s12">
                        <div class="card custom-card data-table">
                            <div class="card-content">
                                <span class="card-title">
                                    <i class="material-icons left">people</i>
                                    موجودی کریدیت نمایندگان
                                </span>
                                <table class="striped responsive-table">
                                    <thead>
                                        <tr>
                                            <th>نماینده</th>
                                            <th>موجودی کریدیت</th>
                                            <th>کل دریافتی</th>
                                            <th>کل خرج شده</th>
                                            <th>وضعیت</th>
                                        </tr>
                                    </thead>
                                    <tbody id="resellersBalanceBody">
                                        <tr>
                                            <td colspan="5" class="center-align">
                                                <div class="preloader-wrapper small active">
                                                    <div class="spinner-layer spinner-teal-only">
                                                        <div class="circle-clipper left">
                                                            <div class="circle"></div>
                                                        </div>
                                                        <div class="gap-patch">
                                                            <div class="circle"></div>
                                                        </div>
                                                        <div class="circle-clipper right">
                                                            <div class="circle"></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="preloader-wrapper big active">
            <div class="spinner-layer spinner-white-only">
                <div class="circle-clipper left">
                    <div class="circle"></div>
                </div>
                <div class="gap-patch">
                    <div class="circle"></div>
                </div>
                <div class="circle-clipper right">
                    <div class="circle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Admin Credit Script -->
    <script src="/js/admin-credit.js"></script>
</body>
</html>
