<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت محصولات</title>

    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <h5>پنل مدیریت</h5>
            </div>

            <div class="user-info">
                <p><strong id="userFullName">مدیر سیستم</strong></p>
                <p id="userUsername">admin</p>
            </div>

            <nav class="nav-menu">
                <a href="/pages/admin/dashboard.html" class="nav-item">
                    <i class="material-icons">dashboard</i>
                    داشبورد
                </a>
                <a href="/pages/admin/products.html" class="nav-item active">
                    <i class="material-icons">inventory</i>
                    مدیریت محصولات
                </a>
                <a href="/pages/admin/resellers.html" class="nav-item">
                    <i class="material-icons">people</i>
                    مدیریت نمایندگان
                </a>
                <a href="/pages/admin/credit.html" class="nav-item">
                    <i class="material-icons">attach_money</i>
                    مدیریت کریدیت
                </a>
                <a href="#" class="nav-item" onclick="logout()">
                    <i class="material-icons">exit_to_app</i>
                    خروج
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Topbar -->
            <div class="topbar">
                <div>
                    <span class="menu-toggle" onclick="toggleSidebar()">
                        <i class="material-icons">menu</i>
                    </span>
                    <h5 style="display: inline-block; margin-right: 10px;">مدیریت محصولات</h5>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Actions -->
                <div class="row">
                    <div class="col s12">
                        <button class="btn waves-effect waves-light blue" onclick="openCreateProductModal()">
                            <i class="material-icons left">add_box</i>
                            افزودن محصول جدید
                        </button>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="row">
                    <div class="col s12">
                        <div class="card custom-card data-table">
                            <div class="card-content">
                                <span class="card-title">
                                    <i class="material-icons left">inventory</i>
                                    لیست محصولات
                                </span>
                                <table class="striped responsive-table">
                                    <thead>
                                        <tr>
                                            <th>نام محصول</th>
                                            <th>نوع</th>
                                            <th>آدرس پنل</th>
                                            <th>توضیحات</th>
                                            <th>وضعیت</th>
                                            <th>عملیات</th>
                                        </tr>
                                    </thead>
                                    <tbody id="productsTableBody">
                                        <tr>
                                            <td colspan="6" class="center-align">
                                                <div class="preloader-wrapper small active">
                                                    <div class="spinner-layer spinner-blue-only">
                                                        <div class="circle-clipper left">
                                                            <div class="circle"></div>
                                                        </div>
                                                        <div class="gap-patch">
                                                            <div class="circle"></div>
                                                        </div>
                                                        <div class="circle-clipper right">
                                                            <div class="circle"></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Product Modal -->
    <div id="createProductModal" class="modal">
        <div class="modal-content">
            <h4>افزودن محصول جدید</h4>
            <form id="createProductForm">
                <div class="row">
                    <div class="input-field col s12 m6">
                        <input id="productName" type="text" required>
                        <label for="productName">نام محصول *</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <select id="productType" required>
                            <option value="" disabled selected>انتخاب نوع</option>
                            <option value="marzban">مرزبان (Marzban)</option>
                            <option value="remnawave">رمناویو (Remnawave)</option>
                            <option value="marzneshin">مرزنشین (Marzneshin)</option>
                        </select>
                        <label>نوع پنل *</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="panelUrl" type="url" required>
                        <label for="panelUrl">آدرس پنل *</label>
                        <span class="helper-text">مثال: https://panel.example.com</span>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="apiKey" type="text" required>
                        <label for="apiKey">API Key *</label>
                    </div>
                    <div class="input-field col s12">
                        <textarea id="productDescription" class="materialize-textarea"></textarea>
                        <label for="productDescription">توضیحات (اختیاری)</label>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-flat waves-effect" onclick="closeCreateProductModal()">لغو</button>
            <button class="btn waves-effect waves-light blue" onclick="createProduct()">
                <i class="material-icons left">check</i>
                ایجاد
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="preloader-wrapper big active">
            <div class="spinner-layer spinner-white-only">
                <div class="circle-clipper left">
                    <div class="circle"></div>
                </div>
                <div class="gap-patch">
                    <div class="circle"></div>
                </div>
                <div class="circle-clipper right">
                    <div class="circle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Admin Products Script -->
    <script src="/js/admin-products.js"></script>
</body>
</html>
