<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت نمایندگان</title>

    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <h5>پنل مدیریت</h5>
            </div>

            <div class="user-info">
                <p><strong id="userFullName">مدیر سیستم</strong></p>
                <p id="userUsername">admin</p>
            </div>

            <nav class="nav-menu">
                <a href="/pages/admin/dashboard.html" class="nav-item">
                    <i class="material-icons">dashboard</i>
                    داشبورد
                </a>
                <a href="/pages/admin/products.html" class="nav-item">
                    <i class="material-icons">inventory</i>
                    مدیریت محصولات
                </a>
                <a href="/pages/admin/resellers.html" class="nav-item active">
                    <i class="material-icons">people</i>
                    مدیریت نمایندگان
                </a>
                <a href="/pages/admin/credit.html" class="nav-item">
                    <i class="material-icons">attach_money</i>
                    مدیریت کریدیت
                </a>
                <a href="#" class="nav-item" onclick="logout()">
                    <i class="material-icons">exit_to_app</i>
                    خروج
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Topbar -->
            <div class="topbar">
                <div>
                    <span class="menu-toggle" onclick="toggleSidebar()">
                        <i class="material-icons">menu</i>
                    </span>
                    <h5 style="display: inline-block; margin-right: 10px;">مدیریت نمایندگان</h5>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Actions -->
                <div class="row">
                    <div class="col s12">
                        <button class="btn waves-effect waves-light purple" onclick="openCreateModal()">
                            <i class="material-icons left">person_add</i>
                            افزودن نماینده جدید
                        </button>
                    </div>
                </div>

                <!-- Resellers Table -->
                <div class="row">
                    <div class="col s12">
                        <div class="card custom-card data-table">
                            <div class="card-content">
                                <span class="card-title">
                                    <i class="material-icons left">people</i>
                                    لیست نمایندگان
                                </span>
                                <table class="striped responsive-table">
                                    <thead>
                                        <tr>
                                            <th>نام کامل</th>
                                            <th>نام کاربری</th>
                                            <th>ایمیل</th>
                                            <th>موجودی کریدیت</th>
                                            <th>وضعیت</th>
                                            <th>عملیات</th>
                                        </tr>
                                    </thead>
                                    <tbody id="resellersTableBody">
                                        <tr>
                                            <td colspan="6" class="center-align">
                                                <div class="preloader-wrapper small active">
                                                    <div class="spinner-layer spinner-purple-only">
                                                        <div class="circle-clipper left">
                                                            <div class="circle"></div>
                                                        </div>
                                                        <div class="gap-patch">
                                                            <div class="circle"></div>
                                                        </div>
                                                        <div class="circle-clipper right">
                                                            <div class="circle"></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Reseller Modal -->
    <div id="createResellerModal" class="modal">
        <div class="modal-content">
            <h4>افزودن نماینده جدید</h4>
            <form id="createResellerForm">
                <div class="row">
                    <div class="input-field col s12 m6">
                        <input id="newUsername" type="text" required>
                        <label for="newUsername">نام کاربری *</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="newPassword" type="password" required>
                        <label for="newPassword">رمز عبور *</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="newFullName" type="text" required>
                        <label for="newFullName">نام کامل *</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="newEmail" type="email">
                        <label for="newEmail">ایمیل (اختیاری)</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="newPhone" type="text">
                        <label for="newPhone">شماره تماس (اختیاری)</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="initialCredit" type="number" min="0" value="0">
                        <label for="initialCredit">کریدیت اولیه</label>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-flat waves-effect" onclick="closeCreateModal()">لغو</button>
            <button class="btn waves-effect waves-light purple" onclick="createReseller()">
                <i class="material-icons left">check</i>
                ایجاد
            </button>
        </div>
    </div>

    <!-- Add Credit Modal -->
    <div id="addCreditModal" class="modal">
        <div class="modal-content">
            <h4>افزودن کریدیت</h4>
            <p>نماینده: <strong id="creditResellerName"></strong></p>
            <form id="addCreditForm">
                <div class="input-field">
                    <input id="creditAmount" type="number" min="1" required>
                    <label for="creditAmount">مقدار کریدیت *</label>
                </div>
                <div class="input-field">
                    <input id="creditNote" type="text">
                    <label for="creditNote">یادداشت (اختیاری)</label>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-flat waves-effect" onclick="closeAddCreditModal()">لغو</button>
            <button class="btn waves-effect waves-light green" onclick="addCredit()">
                <i class="material-icons left">check</i>
                افزودن
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="preloader-wrapper big active">
            <div class="spinner-layer spinner-white-only">
                <div class="circle-clipper left">
                    <div class="circle"></div>
                </div>
                <div class="gap-patch">
                    <div class="circle"></div>
                </div>
                <div class="circle-clipper right">
                    <div class="circle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <!-- API Client -->
    <script src="/js/api.js"></script>
    <!-- Admin Resellers Script -->
    <script src="/js/admin-resellers.js"></script>
</body>
</html>
